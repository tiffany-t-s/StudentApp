{% extends "base.html" %}
{% import 'bootstrap_wtf.html' as wtf %}

{% block content %}
    <h1>Create a New Class</h1>

   <form action = "{{url_for('main.createclass')}}" method = "POST">
    {{form.hidden_tag()}}

   </form>
{% endblock %}
